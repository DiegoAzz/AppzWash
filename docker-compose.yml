version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: appzwash_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appzwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appzwash_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-appzwash_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appzwash} -d ${POSTGRES_DB:-appzwash_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: appzwash_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appzwash_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-appzwash}:${POSTGRES_PASSWORD:-appzwash_secret_pass}@postgres:5432/${POSTGRES_DB:-appzwash_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-appzwash-2026}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: appzwash_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
